<thead>
    <tr>
        <th>Title</th>
        <th>Collection</th>
        <th>Artist</th>
    </tr>
</thead>
<tbody>
    {% for song in songs %}
    <tr>
        <td>{{ song.title }}</td>
        <td>{{ "{:?}" | format(song.collection) }}</td>
        <td>{{ song.artist }}</td>
    </tr>
    {% endfor %}
</tbody>
