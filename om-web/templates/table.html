<thead>
    <tr>
        <th>Title</th>
        <th>Collection</th>
        <th>Artist</th>
    </tr>
</thead>
<tbody>
    {% for track in tracks %}
    <tr>
        <td>{{ track.title }}</td>
        <td>{{ "{:?}" | format(track.collection) }}</td>
        <td>{{ track.artist }}</td>
    </tr>
    {% endfor %}
</tbody>
